html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}

body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.55}

nav{display:flex;gap:16px;flex-wrap:wrap;font-weight:500;margin-bottom:18px}

h1 mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit;padding:0 .1em}

.sub{margin:0 0 22px;color:var(--muted);max-width:56ch}

.note{color:var(--muted);font-size:.85rem}

.card.got{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.card .t{aspect-ratio:4/3;display:grid;place-items:center;font-size:3.4rem;border-bottom:1px solid var(--line);position:relative}
.card .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.cat{font-size:.76rem;color:var(--muted)}
.ko{font-weight:700;margin:0;font-size:.98rem}
.ja{margin:0;font-size:.76rem;color:var(--muted)}

.acts a{background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent)}

</head>

<section class="panel"><div class="head"><h2>${esc(c.rail)}</h2><span class="note">${esc(c.railNote)}</span></div><div class="rail">${c.items.slice(0,8).map((g,i)=>`<a class="mini" href="${esc(g.u)}" target="_blank" rel="noopener noreferrer"><div class="t" style="background:var(${SW[i%5]})">${c.official?'<span class="badge">신상</span>':""}${g.ltd?'<span class="badge ltd">한정</span>':""}${g.emo}</div><p>${esc(g.ko)}</p></a>`).join("")}</div></section>
<section class="panel"><div class="head"><h2>내 손안의 소품샵</h2><span class="note">로그인 없이 이 기기에 저장돼요 · <a href="#mypage">마이페이지 보기</a></span></div><div id="sum"></div><div class="bar" aria-hidden="true"><i id="fill"></i></div><div class="row" id="modes" role="group" aria-label="보기 방식"></div></section>
<section class="panel"><div class="head"><h2>굿즈 둘러보기</h2><span class="note" id="cnt"></span></div><div class="tools"><input type="search" id="q" placeholder="굿즈 이름 검색" aria-label="굿즈 이름 검색"><select id="sort" aria-label="정렬"></select></div><div class="row"><span class="lbl">테마</span><span class="row" id="chips" role="group" aria-label="테마"></span></div><div class="row" style="margin-top:8px"><span class="lbl">종류</span><span class="row" id="kinds" role="group" aria-label="종류"></span></div><div class="grid" id="grid"></div></section>
<section class="panel"><div class="head"><h2>한국에서 어디서 살 수 있어요?</h2><span class="note">새 탭에서 열려요</span></div><div class="shops">${c.shops.map(x=>`<a class="shop" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer"><b>${esc(x.n)}</b><span class="tag">${esc(x.t)}</span><p>${esc(x.d)}</p></a>`).join("")}</div><div class="cats"><a href="https://www.instagram.com/explore/tags/${encodeURIComponent(c.tag)}/" target="_blank" rel="noopener noreferrer">인스타그램에서 찾기<small>#${esc(c.tag)}</small></a><a href="${esc(N(c.tag.replace("굿즈"," 굿즈")))}" target="_blank" rel="noopener noreferrer">네이버 쇼핑에서 찾기<small>${esc(c.tag.replace("굿즈"," 굿즈"))}</small></a></div><p class="note" style="margin:12px 0 0">개인 소품샵과 인스타 계정은 확인된 곳만 담아요. 위 검색 링크로 직접 찾아볼 수도 있어요. 재고와 판매 여부는 판매처에서 확인해 주세요.</p></section>
<section class="panel"><div class="head"><h2>${esc(c.moreTitle)}</h2><span class="note">새 탭에서 열려요</span></div><div class="cats">${c.more.map(m=>`<a href="${esc(m[2])}" target="_blank" rel="noopener noreferrer">${esc(m[0])}<small>${esc(m[1])}</small></a>`).join("")}</div>${c.tags?`<h2 style="margin:20px 0 10px;font-size:1.2rem">캐릭터별로 찾기</h2><div class="chars">${c.tags.map(t=>`<a href="${esc(t[1])}" target="_blank" rel="noopener noreferrer"><b style="background:var(${t[3]})">${t[2]}</b>${esc(t[0])}</a>`).join("")}</div>`:""}</section>${foot(c)}`;
  picks();modes();chips();kinds();sorts();stats();grid();wh();
}
function chips(){
  const names=["전체",...new Set(ch.items.map(g=>g.cat))];
  $("chips").innerHTML=names.map(n=>{const k=n==="전체"?ch.items.length:ch.items.filter(g=>g.cat===n).length;return `<button class="chip" data-c="${esc(n)}" aria-pressed="${n===cur}">${esc(n)}<small>${k}</small></button>`}).join("");
}
function kinds(){
  const have=new Set(ch.items.map(kindOf)),names=["전체",...KORDER.filter(x=>have.has(x))];
  $("kinds").innerHTML=names.map(n=>{const k=n==="전체"?ch.items.length:ch.items.filter(g=>kindOf(g)===n).length;return `<button class="chip" data-kd="${esc(n)}" aria-pressed="${n===kind}">${esc(n)}<small>${k}</small></button>`}).join("");
}
function modes(){
  $("modes").innerHTML=[["all","전체 보기",ch.items.length],["own","소장품",count(ch)],["wish","위시리스트",wcount(ch)]].map(m=>`<button class="chip" data-m="${m[0]}" aria-pressed="${m[0]===mode}">${m[1]}<small>${m[2]}</small></button>`).join("");
}
function sorts(){
  const o=[["def","기본 (최신순)"],["ltd","한정판 우선"]];
  if(ch.items.some(g=>priceOf(g)!=null))o.push(["lo","가격 낮은순"],["hi","가격 높은순"]);
  $("sort").innerHTML=o.map(x=>`<option value="${x[0]}"${x[0]===sortK?" selected":""}>${x[1]}</option>`).join("");
}
function stats(){
  const n=count(ch);
  $("sum").innerHTML=`모은 굿즈 <b>${n}</b> / ${ch.items.length}`;
  $("fill").style.width=(n/ch.items.length*100)+"%";
}
function grid(){
  const idx=new Map(ch.items.map((g,i)=>[g,i]));
  const l=ch.items.filter(g=>(cur==="전체"||g.cat===cur)&&(kind==="전체"||kindOf(g)===kind)&&(mode==="all"||(mode==="own"?has(ch,g):!!st.wish[ch.k+":"+g.id]))&&(!q||(g.ko+g.ja).toLowerCase().includes(q)));
  if(sortK==="ltd")l.sort((a,b)=>b.ltd-a.ltd||idx.get(a)-idx.get(b));
  else if(sortK==="lo"||sortK==="hi"){const d=sortK==="lo"?1:-1;l.sort((a,b)=>{const x=priceOf(a),y=priceOf(b);if(x==null&&y==null)return idx.get(a)-idx.get(b);if(x==null)return 1;if(y==null)return -1;return (x-y)*d||idx.get(a)-idx.get(b)})}
  $("cnt").textContent=l.length+"개"+((sortK==="lo"||sortK==="hi")?" · 가격 정보가 없는 굿즈는 맨 뒤에 있어요":"");
  $("grid").innerHTML=l.length?l.map(g=>{
    const i=idx.get(g),k=ch.k+":"+g.id,e=st.items[k],on=!!e,w=!!st.wish[k];
    return `<article class="card${on?" got":w?" wish":""}"><div class="t" style="background:var(${SW[i%5]})">${g.ltd?'<span class="badge ltd">한정</span>':""}${g.emo}</div><div class="b"><span class="cat">${esc(g.cat)}${g.p?" · "+esc(g.p):""}</span><h3 class="ko">${esc(g.ko)}</h3><p class="ja" lang="ja">${esc(g.ja)}</p>${on?`<input class="where" data-w="${esc(g.id)}" list="wh" maxlength="30" value="${esc(e.w||"")}" placeholder="어디서 샀나요?" aria-label="${esc(g.ko)} 구매처">`:""}<div class="acts"><a href="${esc(g.u)}" target="_blank" rel="noopener noreferrer">${esc(ch.btn)}</a><div class="two">${on?"":`<button data-wish="${esc(g.id)}" aria-pressed="${w}">${w?"♥ 찜함":"♡ 찜"}</button>`}<button class="${on?"full":""}" data-id="${esc(g.id)}" aria-pressed="${on}">${on?"모았어요 ✓":"모았어요"}</button></div></div></div></article>`;
  }).join(""):(mode==="own"&&!count(ch)?shelf("아직 수납장이 텅 비어 있어요!","첫 굿즈를 채워 보세요."):mode==="wish"&&!wcount(ch)?shelf("찜한 굿즈가 아직 없어요.","눈독 들이는 굿즈에 ♡를 눌러 보세요."):shelf("조건에 맞는 굿즈가 없어요.","필터나 검색어를 바꿔 보세요."));
}

function mypage(){
  ch=null;
  const n=total(),lv=level(n),pm=placeMap(),pk=Object.keys(pm).sort((a,b)=>pm[b]-pm[a]).slice(0,8),mx=pm[pk[0]]||1,fans=C.filter(c=>count(c)>0).length;
  const all=ACH(),done=all.filter(a=>st.ach[a.id]).sort((a,b)=>st.ach[b.id]-st.ach[a.id]),doing=all.filter(a=>!st.ach[a.id]).sort((a,b)=>b.cur/b.goal-a.cur/a.goal);
  const recent=Object.entries(st.items).filter(e=>e[1].t).sort((a,b)=>b[1].t-a[1].t).map(e=>{const i=e[0].indexOf(":"),c=C.find(x=>x.k===e[0].slice(0,i)),g=c&&c.items.find(x=>x.id===e[0].slice(i+1));return c&&g?{c,g,w:e[1].w}:null}).filter(Boolean).slice(0,8);
  const ac=a=>{const ok=!!st.ach[a.id],p=Math.min(100,a.cur/a.goal*100);return `<div class="ach${ok?" on":""}"><span class="ico" aria-hidden="true">${ok?a.ico:"🔒"}</span><div><b>${esc(a.t)}</b><p>${esc(a.d)}</p><div class="bar sm" aria-hidden="true"><i style="width:${p}%"></i></div><small>${Math.min(a.cur,a.goal)} / ${a.goal}${ok?" · 달성":""}</small></div></div>`};
  const wl=[];C.forEach(c=>c.items.forEach(g=>{const t=st.wish[c.k+":"+g.id];if(t)wl.push({c,g,t})}));wl.sort((a,b)=>b.t-a.t);
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(st))));
  main.innerHTML=`<h1><mark>마이</mark>페이지</h1><p class="sub">내가 모은 굿즈, 산 곳, 달성한 업적을 한눈에 봐요.</p>
<section class="panel hero"><div class="av big" style="background:var(--s1)" aria-hidden="true">${lv.e}</div><div style="flex:1"><h2>${lv.t}</h2><p style="margin:0">모은 굿즈 <b>${n}</b>개 · 캐릭터 ${fans}종 · 구매처 ${Object.keys(pm).length}곳</p><div class="bar" aria-hidden="true"><i style="width:${lv.pct}%"></i></div><p class="note" style="margin:0">${lv.next?"다음 등급까지 "+lv.next+"개 남았어요":"최고 등급이에요!"}</p></div></section>
<section class="panel"><div class="head"><h2>캐릭터별 수집 현황</h2><span class="note">이 도감에 실린 굿즈 기준이에요</span></div>${C.map(c=>{const k=count(c),t=c.items.length;return `<div class="rowline"><a href="#${c.k}">${esc(c.name)}</a><div class="bar" aria-hidden="true"><i style="width:${k/t*100}%"></i></div><span>${k} / ${t}</span></div>`}).join("")}${n?"":shelf("아직 수납장이 텅 비어 있어요!","첫 굿즈를 채워 보세요.")}</section>
<section class="panel"><div class="head"><h2>어디서 샀나요?</h2><span class="note">굿즈 카드에서 구매처를 적으면 여기에 모여요</span></div>${pk.length?pk.map(w=>`<div class="rowline"><span>${esc(w)}</span><div class="bar" aria-hidden="true"><i style="width:${pm[w]/mx*100}%"></i></div><span>${pm[w]}개</span></div>`).join(""):`<p class="note">아직 적은 구매처가 없어요. 굿즈 페이지에서 모았어요 체크를 누르고 구매처를 적어 보세요.</p>`}${recent.length?`<h2 style="margin:18px 0 6px;font-size:1.1rem">최근에 모은 굿즈</h2><ul class="how">${recent.map(r=>`<li>${r.g.emo} ${esc(r.g.ko)} · ${esc(r.c.name)} · ${r.w?esc(r.w):"구매처 미입력"}</li>`).join("")}</ul>`:""}</section>
<section class="panel"><div class="head"><h2>위시리스트</h2><span class="note">${wl.length}개 · 사고 싶은 굿즈</span></div>${wl.length?`<div class="shops">${wl.slice(0,20).map(r=>`<a class="shop" href="${esc(r.g.u)}" target="_blank" rel="noopener noreferrer"><b>${r.g.emo} ${esc(r.g.ko)}</b><span class="tag">${esc(r.c.name)}</span></a>`).join("")}</div>`:shelf("찜한 굿즈가 아직 없어요.","굿즈 카드의 ♡를 눌러 눈독 들이는 굿즈를 모아 보세요.")}</section>
<section class="panel"><div class="head"><h2>업적·도전과제</h2><span class="note">달성 ${done.length} / ${all.length}</span></div>${doing.length?`<h2 style="margin:0 0 8px;font-size:1.1rem">도전 중</h2><div class="achs">${doing.map(ac).join("")}</div>`:""}${done.length?`<h2 style="margin:0 0 8px;font-size:1.1rem">달성한 업적</h2><div class="achs">${done.map(ac).join("")}</div>`:""}</section>
<section class="panel"><div class="head"><h2>기록 옮기기</h2><span class="note">로그인 없이 이 기기 브라우저에 저장돼요</span></div><p class="note" style="margin:0 0 10px">기기를 바꾸거나 브라우저 데이터를 지우면 기록이 사라질 수 있어요. 아래 코드를 복사해 두었다가 다른 기기에서 붙여 넣으면 이어서 쓸 수 있어요.</p><textarea id="code" readonly aria-label="내 기록 코드">${code}</textarea><div class="row" style="margin:8px 0 14px"><button class="chip" id="copy">코드 복사</button></div><textarea id="imp" placeholder="다른 기기에서 복사한 코드를 여기에 붙여 넣으세요" aria-label="가져올 코드"></textarea><div class="row" style="margin-top:8px"><button class="chip" id="doimp">가져오기</button></div><p class="note" id="msg" role="status"></p></section>${foot()}`;
}
const okKey=k=>/^[a-z]+:\w+$/.test(k)&&C.some(c=>k.indexOf(c.k+":")===0);
function doImport(){
  const v=$("imp").value.trim();let msg;
  try{
    const j=JSON.parse(decodeURIComponent(escape(atob(v))));
    if(!j||typeof j.items!=="object")throw 0;
    let add=0;
    Object.keys(j.items).forEach(k=>{
      if(!okKey(k))return;const x=j.items[k]||{},w=String(x.w||"").slice(0,30);
      if(!st.items[k]){st.items[k]={w,t:+x.t||0};add++}else if(!st.items[k].w&&w)st.items[k].w=w;
    });
    Object.keys(j.ach||{}).forEach(k=>{if(!st.ach[k]&&+j.ach[k])st.ach[k]=+j.ach[k]});
    Object.keys(j.wish||{}).forEach(k=>{if(okKey(k)&&!st.items[k]&&!st.wish[k]&&+j.wish[k])st.wish[k]=+j.wish[k]});
    st.wf=Math.max(st.wf,+j.wf||0);
    save();sync(false);msg="가져왔어요. 새로 "+add+"개가 합쳐졌어요.";
  }catch(e){msg="코드를 읽지 못했어요. 복사한 코드 전체를 붙여 넣었는지 확인해 주세요."}
  mypage();$("msg").textContent=msg;
}
main.addEventListener("click",e=>{
  let b=e.target.closest("[data-pick]");
  if(b){const k=b.dataset.pick;mine=mine.includes(k)?mine.filter(x=>x!==k):[...mine,k];put("chars",mine);bar();picks();return}
  b=e.target.closest(".chip[data-c]");if(b){cur=b.dataset.c;chips();grid();return}
  b=e.target.closest(".chip[data-kd]");if(b){kind=b.dataset.kd;kinds();grid();return}
  b=e.target.closest(".chip[data-m]");if(b){mode=b.dataset.m;modes();grid();return}
  b=e.target.closest("button[data-wish]");if(b){const k=ch.k+":"+b.dataset.wish;if(st.wish[k])delete st.wish[k];else if(!st.items[k])st.wish[k]=Date.now();save();modes();grid();sync(true);return}
  b=e.target.closest("#copy");
  if(b){const t=$("code");t.select();const d=()=>{$("msg").textContent="복사했어요. 메모장 등에 붙여 넣어 보관하세요."};(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(d,()=>{try{document.execCommand("copy")&&d()}catch(x){}});return}
  b=e.target.closest("#doimp");if(b){doImport();return}
  b=e.target.closest("button[data-id]");
  if(b){const k=ch.k+":"+b.dataset.id;if(st.items[k])delete st.items[k];else{st.items[k]={w:"",t:Date.now()};if(st.wish[k]){delete st.wish[k];st.wf++}}save();stats();modes();grid();wh();sync(true)}
});
main.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value.trim().toLowerCase();grid()}});
main.addEventListener("change",e=>{
  if(e.target.id==="sort"){sortK=e.target.value;grid();return}
  const i=e.target.closest(".where");if(!i||!ch)return;
  const k=ch.k+":"+i.dataset.w;
  if(st.items[k]){st.items[k].w=i.value.trim().slice(0,30);save();wh();sync(true)}
});
function route(){
  const h=location.hash.slice(1),c=C.find(x=>x.k===h);
  view=c?c.k:h==="mypage"?"mypage":"";
  const rs=document.documentElement.style;["--accent","--hi","--bg"].forEach(v=>rs.removeProperty(v));
  if(c&&c.th){rs.setProperty("--accent",c.th[0]);rs.setProperty("--hi",c.th[1]);rs.setProperty("--bg",c.th[2])}
  c?page(c):h==="mypage"?mypage():home();
  bar();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
sync(false);save();wh();
route();
</script>
</body>
</html>
